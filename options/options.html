<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoClick Pilot — Settings</title>
    <link rel="icon" href="../icons/icon-32.png" />
    <link rel="stylesheet" href="../src/ui/theme.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <img src="../icons/icon-48.png" alt="" />
        <div>
          <h1 class="app-title">AutoClick Pilot</h1>
          <p class="app-subtitle">Pick a site and an element. It gets clicked each time the page loads.</p>
        </div>
        <span class="spacer"></span>
        <div class="toolbar">
          <button type="button" class="btn btn-secondary" id="export">Export</button>
          <button type="button" class="btn btn-secondary" id="import">Import</button>
          <input type="file" id="import-file" accept="application/json,.json" hidden />
        </div>
      </div>
    </header>
    <p class="toast" id="toast" role="status" aria-live="polite"></p>
    <main id="app"></main>
    <script type="module" src="options.js"></script>
  </body>
</html>
